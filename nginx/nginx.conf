worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $status $log_level {
        ~^5 error;
        ~^4 warn;
        default info;
    }
    log_format structured escape=json
        '{"timestamp":"$time_iso8601","level":"$log_level","service":"nginx",'
        '"event":"http_request","request_id":"$request_id","method":"$request_method",'
        '"route":"$uri","status":$status,"duration_seconds":$request_time}';
    access_log /dev/stdout structured;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream cinema_app {
        server app:3000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Request-ID $request_id always;

        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }

        location / {
            return 301 https://localhost:18443$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/localhost.crt;
        ssl_certificate_key /etc/nginx/ssl/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Request-ID $request_id always;

        location = /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }

        location / {
            proxy_pass http://cinema_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_hide_header X-Request-ID;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
